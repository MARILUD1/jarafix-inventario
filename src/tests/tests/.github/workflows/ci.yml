name: CI - JaraFix Inventario

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    
    - name: Run tests
      run: |
        cd tests
        python -m unittest test_inventario.py -v
      continue-on-error: true
    
    - name: Verify pipeline
      run: echo "✅ Pipeline de CI ejecutado correctamente para JaraFix Inventario"
